spring.application.name=Tienda de Mama

# ============ Database ============
# Local dev: uses MySQL defaults below
# Production: set DATABASE_URL, DB_USERNAME, DB_PASSWORD env vars
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/tienda_mama?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Flores12}

# JPA - auto-detect dialect from driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# CORS
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT
jwt.secret=${JWT_SECRET:TiendaDeMamaSecretKeyParaJWT2024MuySegura123456789}
jwt.expiration=86400000
