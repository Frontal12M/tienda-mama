services:
  - type: web
    name: tienda-mama-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-mama-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: tienda-mama-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tienda-mama-db
          property: password
      - key: CORS_ORIGINS
        value: https://tienda-mama.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"

databases:
  - name: tienda-mama-db
    plan: free
    databaseName: tienda_mama
